<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/logo-mark.png" />
    <title>Novarchin — Engineering Africa's Digital Future</title>
    <meta name="description" content="Novarchin builds secure, scalable enterprise software, AI, cloud and cybersecurity solutions for businesses, governments and NGOs across Africa." />
    <meta name="theme-color" content="#070506" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Novarchin — Engineering Africa's Digital Future" />
    <meta property="og:description" content="Enterprise software, AI, cloud, cybersecurity and digital transformation for Africa." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&family=Instrument+Serif:ital@1&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
        } catch (e) {
          /* keep dark default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
